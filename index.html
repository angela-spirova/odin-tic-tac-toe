<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <h1>Tic Tac Toe</h1>

    <dialog id="before-game" open>
        <h2>Enter names</h2>
        <form action="" name="player-names">
            
            <label for="p1-name">Player 1:</label>
            <label for="p2-name">Player 2:</label>
            <input type="text" id="p1-name" name="p1name" placeholder="Enter name...">
            
            <input type="text" id="p2-name" name="p2name" placeholder="Enter name...">

            <button id="start-game">Start</button>
        </form>
    </dialog>
    <div id="gameboard" class="game-not-started">
        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>
        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>
        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>
    </div>

    <div id="game-over">
        <h1 id="results"></h1>
        <button id="reset-game">Play again?</button>
    </div>
</body>
</html>
